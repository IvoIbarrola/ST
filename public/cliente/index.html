<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ST - Seguimiento</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
  </head>
  <body class="container-fluid text-center bg-light">
    <form
      class="m-5"
      action="controladores/controlador_seguimiento.php"
      method="post"
    >
      <h1>Seguimiento de dispositivos</h1>
      <input
        class="mt-5 form-control"
        type="text"
        name="cod_seguimiento"
        placeholder="Código de seguimiento"
      />
      <input class="btn" type="submit" value="Buscar" />
    </form>
    <p id="info_seguimiento"></p>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const estado = urlParams.get("estado");

      switch (estado) {
        case "1":
          document.getElementById("info_seguimiento").innerHTML =
            "Estado: Dispositivo recibido y en espera de reparación";
          break;
        case "2":
          document.getElementById("info_seguimiento").innerHTML =
            "Estado: Dispositivo en proceso de reparación";
          break;
        case "3":
          document.getElementById("info_seguimiento").innerHTML =
            "Estado: Dispositivo funcionando y listo para entregar";
          break;
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
